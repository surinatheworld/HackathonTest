<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nông Trại DeFi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen top-down village map; a dark lacquered-wood HUD strip on top, the zone board slides in from the right (bottom sheet on phones). Single deliberate look: dark UI over a sunlit map. */
:root{
  --board:#1c2a23; --board-2:#26372e; --line:#3a5145; --ink:#f3ecd9; --muted:#aebaa3;
  --straw:#f2c14e; --chili:#e8604a; --leaf:#86d36f; --sky:#6cbde0; --deep:#0f1814;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--board);border-bottom:2px solid var(--line);z-index:6}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;color:var(--straw);letter-spacing:.01em}
.brand small{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:flex;flex-direction:column;padding:3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--board-2);min-width:0}
.chip small{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip b{font-size:13px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.up{color:var(--leaf)} .down{color:#ff9a86}
.ctrls{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--board-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover{border-color:var(--straw)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on,.btn.primary{background:var(--straw);color:var(--deep);border-color:var(--straw)}
.btn.danger{background:transparent;color:#ff9a86;border-color:#7a3a2e}
.btn.storm{color:var(--sky);border-color:#2f5a6c}
:focus-visible{outline:2px solid var(--straw);outline-offset:2px}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#69aa4b}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

.panel{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:min(390px,calc(100% - 24px));background:var(--board);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(0,0,0,.4);z-index:5}
.phead{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.phead div{min-width:0}
.tagline{font-size:11px;color:var(--straw);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.phead h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;margin:2px 0 6px;text-wrap:balance}
.chains{display:flex;gap:6px;flex-wrap:wrap}
.chain{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:#2f4639;color:var(--leaf);white-space:nowrap}
.chain.c{color:#ffb7a8;background:#4a2f29}
.chain.x{color:var(--straw);background:#4a3e1f}
.close{margin-left:auto;flex:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--board-2);color:var(--ink);font-size:18px;line-height:1}
.pbody{overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
.note b{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--board-2);padding-inline:10px}
.field:focus-within{border-color:var(--straw)}
.field input,.field select{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;padding:9px 0;outline:none}
.field select option{background:var(--board-2)}
.field span{font-size:12px;color:var(--muted);font-weight:700}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 -6px}
.term{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0}
.ok{color:var(--leaf)} .bad{color:#ff8f7a} .dim{color:var(--muted)} .warn{color:var(--straw)}
.bar{height:8px;border-radius:5px;background:#33483c;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--board-2);align-items:center}
.item .bar{grid-column:1/-1}
.item b{font-size:14px}
.item small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tier{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--board-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tier:hover{border-color:var(--straw)}
.tier b{font-size:13px}
.tier small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tier em{font-style:normal;color:var(--leaf);font-weight:700;font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:#2f4639;color:var(--leaf)} .pill.r{background:#4a2f29;color:#ff9a86} .pill.y{background:#4a3e1f;color:var(--straw)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
.tbl th,.tbl td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tbl tr:last-child td{border-bottom:0}
.steps{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--muted)}
.steps b{color:var(--ink)}

.prompt{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;background:var(--straw);color:var(--deep);border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
.prompt kbd{font-family:var(--mono);background:rgba(0,0,0,.15);border-radius:5px;padding:1px 6px;margin-right:6px}
.log{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 24px));z-index:3;background:rgba(15,24,20,.86);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;font-size:12px;pointer-events:none}
.log h3{margin:0;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.log p{margin:0;line-height:1.4;display:flex;gap:6px;align-items:baseline;min-width:0}
.log p span:last-child{min-width:0;overflow-wrap:anywhere}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7;background:var(--deep);border:1px solid var(--straw);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.hint{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));z-index:3;background:rgba(15,24,20,.78);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);pointer-events:none}
.hint b{color:var(--ink)}

@media (max-width:760px){
  .panel{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:58%}
  .app.open .log,.app.open .hint{display:none}
  .chip.wide{display:none}
  .brand small{display:none}
  .hint{display:none}
}
@media (max-width:460px){
  .chip{padding:2px 7px}
  .chip b{font-size:12px}
  .btn{padding:5px 8px;font-size:12px}
  .log{display:none}
}
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="brand"><b>Nông Trại DeFi</b><small>Prototype · Avalanche</small></div>
    <div class="chips">
      <div class="chip"><small>Ngày</small><b id="h-day">12</b></div>
      <div class="chip"><small>AVAX</small><b id="h-price">$25,40</b></div>
      <div class="chip"><small>Thời tiết</small><b id="h-wx">Nắng</b></div>
      <div class="chip"><small>Ví</small><b id="h-wallet">500 USDC</b></div>
      <div class="chip"><small>Điểm mùa</small><b id="h-pts">40</b></div>
      <div class="chip wide"><small>Tài sản ròng</small><b id="h-net">0</b></div>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Tốc độ thời gian">
        <button class="btn" id="sp0" data-speed="0" title="Tạm dừng">Dừng</button>
        <button class="btn on" id="sp1" data-speed="1" title="1 ngày mỗi 3 giây">1×</button>
        <button class="btn" id="sp2" data-speed="2" title="1 tuần mỗi 3 giây">7×</button>
      </div>
      <button class="btn storm" id="b-storm" title="Ép giá AVAX giảm mạnh trong 1,5 ngày">Gây bão</button>
      <button class="btn" id="b-design">Bản thiết kế</button>
      <button class="btn primary" id="b-wallet">Kết nối ví</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Bản đồ nông trại. Dùng WASD hoặc phím mũi tên để đi, E để tương tác, hoặc chạm vào bản đồ."></canvas>
    <div class="hint"><b>WASD / mũi tên</b> để đi · <b>E</b> để mở · hoặc chạm vào khu vực</div>
    <div class="log" id="log" aria-live="polite"></div>
    <button class="prompt" id="prompt" hidden></button>
    <div class="toast" id="toast" role="status" hidden></div>
    <section class="panel" id="panel" hidden aria-labelledby="p-title">
      <div class="phead">
        <div>
          <div class="tagline" id="p-tag"></div>
          <h2 id="p-title"></h2>
          <div class="chains" id="p-chains"></div>
        </div>
        <button class="close" id="p-close" aria-label="Đóng">×</button>
      </div>
      <div class="pbody">
        <div id="p-stats" style="display:flex;flex-direction:column;gap:14px"></div>
        <div id="p-actions" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="prototype/chain-config.js"></script>
<script src="prototype/chain.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const app=$('#app'), stage=$('#stage'), cv=$('#cv'), ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CH=window.FarmChain||{available:false,live:false,reason:'Bản này chỉ có chế độ mô phỏng. Mở bản trên GitHub sau khi deploy để chơi on-chain.'};

/* ---------- map ---------- */
const T=32, W=46, H=30;
const G=0,P=1,WA=2,D=3,F=4,B=5,PL=6,SA=7,K=8;
const map=new Uint8Array(W*H);
const fill=(x0,y0,x1,y1,t)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&y>=0&&x<W&&y<H)map[y*W+x]=t};
const tile=(x,y)=>(x<0||y<0||x>=W||y>=H)?-1:map[y*W+x];
fill(0,14,W-1,15,P); fill(21,0,22,H-1,P);
fill(2,2,11,9,D);
fill(38,2,44,11,D);
for(let x=37;x<=45;x++){fill(x,1,x,1,F);fill(x,12,x,12,F)}
for(let y=1;y<=12;y++){fill(37,y,37,y,F);fill(45,y,45,y,F)}
fill(41,12,41,13,P);
fill(1,17,12,27,SA); fill(2,18,11,26,WA); fill(7,17,7,20,K);
fill(13,17,19,25,PL);
fill(16,8,17,13,P); fill(14,3,19,7,B);
fill(24,16,24,24,P); fill(24,24,29,24,P); fill(25,19,31,23,B);
fill(33,16,33,22,P); fill(33,22,37,22,P); fill(34,18,38,21,B);
fill(20,0,20,1,B); fill(23,0,23,1,B);
const solid=(x,y)=>{const t=tile(Math.floor(x),Math.floor(y));return t<0||t===WA||t===F||t===B};
const hsh=(x,y,s=0)=>{let h=(x*374761393+y*668265263+s*982451653)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295};

/* ---------- zones ---------- */
const ZONES=[
  {id:'home',   name:'Nhà mình',        tag:'Tổng quan nông trại',    ax:36.5,ay:22.6, sx:39.6,sy:22.4, area:[34,18,39,23], chains:[['C-Chain','c']]},
  {id:'lend',   name:'Ruộng rau',       tag:'Cho vay stablecoin',     ax:7,   ay:11.4, sx:7,   sy:10.5, area:[2,2,12,11],  chains:[['C-Chain','c'],['Fee manager','x']]},
  {id:'orchard',name:'Vườn cây',        tag:'Staking có khóa',        ax:30,  ay:12.2, sx:30,  sy:11.3, area:[25,2,36,12], chains:[['C-Chain','c'],['Fee manager','x']]},
  {id:'pond',   name:'Ao cá',           tag:'Cung cấp thanh khoản LP',ax:7.5, ay:16.5, sx:4.4, sy:16.4, area:[1,16,13,28], chains:[['C-Chain','c'],['Fee manager','x']]},
  {id:'market', name:'Chợ phiên',       tag:'AMM đổi token',          ax:16.5,ay:16.6, sx:16.5,sy:16.3, area:[13,16,20,26], chains:[['C-Chain','c']]},
  {id:'coop',   name:'Hợp tác xã',      tag:'Vay thế chấp',           ax:28.5,ay:24.6, sx:31.4,sy:24.5, area:[24,19,32,25], chains:[['C-Chain','c']]},
  {id:'butler', name:'Nhà quản gia AI', tag:'Agent có guardrail',     ax:17,  ay:8.7,  sx:19.6,sy:8.9,  area:[14,3,20,9],   chains:[['C-Chain','c'],['Fee manager','x'],['x402','x']]},
  {id:'neighbor',name:'Vườn bác Tư',    tag:'Hái trộm điểm thưởng',   ax:41.5,ay:13.3, sx:43.6,sy:13.2, area:[37,1,46,14], chains:[['C-Chain','c']]},
  {id:'gate',   name:'Cổng làng',       tag:'Fee manager trả gas hộ', ax:22,  ay:2.6,  sx:null,sy:null, area:[20,0,24,3],   chains:[['Fee manager','x'],['ERC-2771','x']]},
];
const Z=Object.fromEntries(ZONES.map(z=>[z.id,z]));
const BEDS=[];for(const y of [3.4,5.8,8.2])for(const x of [3,5,7,9,11])BEDS.push([x,y]);
const SPOTS=[];for(const y of [3.8,6.6,9.4])for(const x of [26.2,28.8,31.4,34])SPOTS.push([x,y]);
const NBEDS=[[39.6,3.8],[41.6,3.8],[43.6,3.8],[39.6,6.4],[41.6,6.4],[43.6,6.4]];
const BUTLER_PATH=[[17,14.6],[17,8.9],[17,14.6],[7,14.6],[7,11.4],[7,14.6],[7.5,16.4],[7.5,14.6],[21.5,14.6],[30,14.6],[30,12.2],[30,14.6]];

/* ---------- state ---------- */
const TIERS={7:{apy:.06,name:'Cây ớt'},30:{apy:.09,name:'Cây xoài'},90:{apy:.14,name:'Cây sầu riêng'}};
const SPEEDS=[0,1/3,7/3];
const st={
  day:12.3, price:25.4, usdc:500, avax:20, points:40,
  lend:{p:300,acc:0.21},
  locks:[{id:1,amt:200,days:30,apy:.09,start:2},{id:2,amt:100,days:7,apy:.06,start:6.1}],
  lp:{V0:150,p0:24.1,fees:0.09},
  debt:0, coll:0, lastStormLog:-9,
  butler:{hired:false,cap:200,spent:0,auto:true,lastMove:-9,warned:false,log:[]},
  neighbor:{ripe:22,cool:0},
  pool:{k:50000*2000},
  storm:0, hist:[], weather:'nắng', speed:1, nextId:3, log:[]
};
{let p=st.price;for(let i=40;i>=0;i--){st.hist.unshift({d:st.day-i*0.05,p});p*=1+(Math.sin(i*1.7)*0.004)}}

const nf=(n,d=2)=>Number(n).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=(n,d=2)=>nf(n,d)+' USDC';
const lockSum=()=>st.locks.reduce((s,l)=>s+l.amt,0);
const lockAcc=l=>l.amt*l.apy*Math.max(0,Math.min(st.day-l.start,l.days))/365;
const ripe=l=>st.day-l.start>=l.days;
const lpVal=()=>st.lp?st.lp.V0*Math.sqrt(st.price/st.lp.p0):0;
const lpIL=()=>{if(!st.lp)return 0;const hodl=st.lp.V0/2*(1+st.price/st.lp.p0);return lpVal()/hodl-1};
const collateral=()=>st.coll*st.price;
const hf=()=>st.debt>0?collateral()*0.8/st.debt:Infinity;
const maxBorrow=()=>Math.max(0,collateral()*0.6-st.debt);
const netWorth=()=>st.usdc+st.avax*st.price+st.lend.p+st.lend.acc+st.locks.reduce((s,l)=>s+l.amt+lockAcc(l),0)+lpVal()+(st.lp?st.lp.fees:0)+st.coll*st.price-st.debt;
const priceAgo=d=>{const t=st.day-d;let best=st.hist[0];for(const h of st.hist){if(h.d<=t)best=h;else break}return best.p};
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

/* ---------- effects ---------- */
const letters=[], floaters=[];
function floater(x,y,text,color='#f2c14e'){floaters.push({x,y,text,color,t:0})}
function floatZ(id,text,color){const z=Z[id];floater(z.ax,z.ay-1.2,text,color)}
function icm(zone,route,text){
  st.log.push({day:st.day,route,text});if(st.log.length>40)st.log.shift();
  const z=Z[zone]||Z.home, g=Z.gate;
  if(route.startsWith('C'))letters.push({x0:22,y0:0.9,x1:z.ax,y1:z.ay-0.6,t:0});
  else if(/^(L1|Ký)/.test(route))letters.push({x0:z.ax,y0:z.ay-0.6,x1:22,y1:0.9,t:0});
  renderLog();
}
function blog(cls,text){st.butler.log.push({cls,text});if(st.butler.log.length>60)st.butler.log.shift()}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2800)}
const hex=()=>'0x'+Array.from({length:8},()=>Math.floor(Math.random()*16).toString(16)).join('')+'…';

/* ---------- simulation ---------- */
let lastSample=st.day;
function sim(dd){
  if(dd<=0)return;
  const prevDay=Math.floor(st.day);
  st.day+=dd;
  let sigma=.025,drift=.004;
  if(st.storm>0){drift=-.22;sigma=.06;st.storm-=dd}
  st.price=Math.max(3,st.price*Math.exp(drift*dd+sigma*Math.sqrt(dd)*gauss()));
  if(st.day-lastSample>=0.05){st.hist.push({d:st.day,p:st.price});lastSample=st.day;while(st.hist.length&&st.hist[0].d<st.day-3)st.hist.shift()}
  const p1=priceAgo(1), vol=Math.abs(st.price-p1)/p1;
  const wx=vol>.09?'bão':vol>.04?'mưa':'nắng';
  if(wx!==st.weather){st.weather=wx;if(wx==='bão'&&st.day-st.lastStormLog>1){st.lastStormLog=st.day;icm('pond','C-Chain',`Oracle: AVAX biến động ${nf(vol*100,1)}%/ngày, thời tiết chuyển sang bão`)}}
  // yields
  if(!CH.live)st.lend.acc+=st.lend.p*.04/365*dd;
  if(st.lp)st.lp.fees+=lpVal()*.18/365*dd;
  st.debt+=st.debt*.08/365*dd;
  if(!CH.live)st.points+=(st.lend.p+lockSum()+lpVal())/100*dd*0.5;
  st.neighbor.ripe=Math.min(60,st.neighbor.ripe+8*dd);
  st.neighbor.cool=Math.max(0,st.neighbor.cool-dd);
  // butler storm rotation
  const b=st.butler;
  if(!CH.live&&b.hired&&b.auto&&st.weather==='bão'&&st.lp&&st.day-b.lastMove>0.2){
    b.lastMove=st.day;
    const room=b.cap-b.spent, total=lpVal()+st.lp.fees;
    if(room>1){
      const amt=Math.min(room,total), frac=amt/total;
      st.lp.V0*=(1-frac);st.lp.fees*=(1-frac);st.lend.p+=amt;b.spent+=amt;
      if(frac>.999)st.lp=null;
      blog('dim',`[ngày ${nf(st.day,1)}] Bão ở ao cá. Đề xuất: chuyển ${usd(amt)} sang ruộng rau.`);
      blog('ok',`PolicyModule.check ✓ ao cá → ruộng rau, trong hạn mức (${nf(b.spent,0)}/${b.cap})`);
      icm('pond','Ký → Fee manager',`Quản gia chuyển vụ: rút ${usd(amt)} khỏi LP, gửi vào FarmGame`);
      floater(butler.x,butler.y-1.4,'Chuyển vụ!','#86d36f');
    }else if(!b.warned){
      b.warned=true;
      blog('warn',`PolicyModule: đã dùng hết hạn mức ${b.cap} USDC hôm nay, dừng chuyển vụ.`);
    }
  }
  if(st.debt>0&&hf()<1)liquidate();
  if(Math.floor(st.day)>prevDay)newDay();
}
function newDay(){
  const b=st.butler;b.spent=0;b.warned=false;
  if(CH.live)return;
  if(b.hired&&b.auto){
    if(st.lend.acc>0.001){st.lend.p+=st.lend.acc;floatZ('lend','+'+nf(st.lend.acc,3)+' tái gieo','#86d36f');st.lend.acc=0}
    for(const l of [...st.locks]){
      if(!ripe(l))continue;
      const v=l.amt+lockAcc(l);
      if(b.spent+v>b.cap){blog('warn',`Quả ${TIERS[l.days].name} đã chín nhưng vượt hạn mức ngày, để mai thu.`);continue}
      b.spent+=v;st.locks=st.locks.filter(x=>x!==l);st.lend.p+=v;
      blog('ok',`PolicyModule.check ✓ thu hoạch ${TIERS[l.days].name}, ${usd(v)} về ruộng rau`);
      icm('orchard','Ký → Fee manager',`Quản gia thu hoạch ${TIERS[l.days].name}: unlock ${usd(v)}`);
    }
  }
  if(!b.hired&&st.points>10&&Math.random()<.15){
    const n=Math.round(st.points*.06);st.points-=n;
    floatZ('lend','-'+n+' điểm bị hái trộm','#ff9a86');
    toast(`Có người hái trộm ${n} điểm mùa của bạn. Thuê quản gia để giữ vườn.`);
  }
}
function liquidate(){
  const need=st.debt*1.1/st.price, take=Math.min(st.coll,need), taken=take*st.price;
  st.coll-=take;st.debt=0;
  floatZ('coop','Hạn hán! Bị thanh lý','#ff9a86');
  icm('coop','C-Chain',`Thanh lý: hệ số an toàn dưới 1,0. HTX thu ${nf(take,3)} AVAX (≈ ${usd(taken)}, gồm 10% phạt)`);
  toast('Hạn hán! Giá AVAX giảm làm hệ số an toàn dưới 1,0, HTX đã thu '+nf(take,3)+' AVAX.');
}

function amt(id){const el=$('#'+id);const v=Number(String(el?.value||'').replace(',','.'));if(!(v>0)){toast('Nhập số lớn hơn 0.');return 0}return v}
function pay(v){if(v>st.usdc+1e-9){toast('Ví chỉ còn '+usd(st.usdc)+'.');return false}st.usdc-=v;return true}
function canRemove(avax){if(st.debt<=0)return true;const ok=(st.coll-avax)*st.price*0.8/st.debt>=1.05;if(!ok)toast('Đang nợ HTX. Rút chừng này AVAX sẽ làm hệ số an toàn dưới 1,05, hãy trả bớt nợ trước.');return ok}

  'lend-out'(){const v=st.lend.p+st.lend.acc;if(v<0.001)return toast('Ruộng đang trống.');st.usdc+=v;st.lend={p:0,acc:0};floatZ('lend','Rút '+nf(v,0));icm('lend','Ký → Fee manager',`Rút toàn bộ ${usd(v)} khỏi FarmGame`)},
  'orch-plant'(arg){const v=amt('amt-orchard');if(!v)return;const d=Number(arg);if(st.locks.length>=SPOTS.length)return toast('Vườn đã kín chỗ, hãy thu hoạch bớt.');if(!pay(v))return;st.locks.push({id:st.nextId++,amt:v,days:d,apy:TIERS[d].apy,start:st.day});floatZ('orchard','Trồng '+TIERS[d].name);icm('orchard','Ký → Fee manager',`Trồng ${TIERS[d].name}: lock(${usd(v)}, ${d} ngày) vào FarmGame`)},
  'orch-harvest'(arg){const l=st.locks.find(x=>x.id==arg);if(!l||!ripe(l))return;const v=l.amt+lockAcc(l);st.locks=st.locks.filter(x=>x!==l);st.usdc+=v;floatZ('orchard','+'+nf(v,2),'#86d36f');icm('orchard','C-Chain',`Thu hoạch ${TIERS[l.days].name}: unlock ${usd(v)} (gốc + lãi)`)},
  'orch-pull'(arg){const l=st.locks.find(x=>x.id==arg);if(!l)return;st.locks=st.locks.filter(x=>x!==l);st.usdc+=l.amt;floatZ('orchard','Nhổ sớm, mất lãi','#ff9a86');icm('orchard','Ký → Fee manager',`Nhổ sớm ${TIERS[l.days].name}: rút ${usd(l.amt)}, bỏ phần lãi`)},
  'pond-add'(){const v=amt('amt-pond');if(!v||!pay(v))return;st.lp=st.lp?{V0:lpVal()+v,p0:st.price,fees:st.lp.fees}:{V0:v,p0:st.price,fees:0};floatZ('pond','Thả cá +'+nf(v,0));icm('pond','Ký → Fee manager',`Thả cá: addLiquidity(${usd(v)}) vào pool USDC/AVAX`)},
  'pond-out'(){if(!st.lp)return toast('Ao đang trống.');const v=lpVal()+st.lp.fees;st.lp=null;st.usdc+=v;floatZ('pond','Vớt cá '+nf(v,0),'#86d36f');icm('pond','C-Chain',`Vớt cá: removeLiquidity, nhận ${usd(v)}`)},
  'coop-borrow'(){const v=amt('amt-coop');if(!v)return;if(v>maxBorrow()+1e-9)return toast('Chỉ vay thêm được tối đa '+usd(maxBorrow())+'.');st.debt+=v;st.usdc+=v;floatZ('coop','Vay '+nf(v,0)+' phân bón');icm('coop','C-Chain',`Vay phân bón: borrow(${usd(v)}) thế chấp bằng nông sản`)},
  'coll-dep'(){const v=amt('amt-coll');if(!v)return;if(v>st.avax+1e-9)return toast('Ví chỉ có '+nf(st.avax,3)+' AVAX.');st.avax-=v;st.coll+=v;floatZ('coop','Gửi '+nf(v,2)+' AVAX vào kho');icm('coop','C-Chain',`Gửi ${nf(v,3)} AVAX vào kho thóc HTX làm thế chấp`)},

  'coop-repay'(){let v=amt('amt-coop');if(!v)return;if(st.debt<=0)return toast('Bạn không nợ HTX.');v=Math.min(v,st.debt);if(!pay(v))return;st.debt-=v;if(st.debt<0.005)st.debt=0;floatZ('coop','Trả nợ '+nf(v,0),'#86d36f');icm('coop','C-Chain',`Trả nợ ${usd(v)} cho HTX`)},
  'butler-hire'(){const b=st.butler;b.hired=true;blog('ok',`[ngày ${nf(st.day,1)}] Cấp session key cho quản gia. Hạn mức ${b.cap} USDC/ngày.`);blog('dim','Whitelist: ruộng rau, vườn cây, ao cá. Mọi địa chỉ khác bị chặn.');icm('butler','C-Chain','SmartAccount.addSessionKey(quản gia, PolicyModule)');butler.i=0;butler.x=17;butler.y=8.9},

    tips.forEach(t=>blog('', '› '+t));

  },
  'butler-attack'(){

function poolRes(){const k=st.pool.k;return {a:Math.sqrt(k/st.price),u:Math.sqrt(k*st.price)}}
function quote(dir,v){const r=poolRes();const rin=dir==='u2a'?r.u:r.a, rout=dir==='u2a'?r.a:r.u;const inF=v*0.997;const out=rout*inF/(rin+inF);const spot=rout/rin;const impact=1-(out/v)/spot;return{out,impact}}

/* morph: patch DOM in place so buttons under the cursor survive re-renders */
function morph(el,html){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  if(!same(el,tmp)){el.innerHTML=html;return}
  patch(el,tmp);
}
function same(a,b){if(a.childNodes.length!==b.childNodes.length)return false;for(let i=0;i<a.childNodes.length;i++){const x=a.childNodes[i],y=b.childNodes[i];if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName)return false;if(x.nodeType===1&&!same(x,y))return false}return true}
function patch(a,b){for(let i=0;i<a.childNodes.length;i++){const x=a.childNodes[i],y=b.childNodes[i];
  if(x.nodeType===3){if(x.data!==y.data)x.data=y.data;continue}
  if(x.nodeType!==1)continue;
  for(const at of [...x.attributes])if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
  for(const at of [...y.attributes])if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value);
  patch(x,y)}}

function tryMove(o,dx,dy,r=.28){
  const nx=o.x+dx;if(!solid(nx-r,o.y)&&!solid(nx+r,o.y)&&!solid(nx-r,o.y-.2)&&!solid(nx+r,o.y-.2))o.x=nx;
  const ny=o.y+dy;if(!solid(o.x-r,ny)&&!solid(o.x+r,ny)&&!solid(o.x-r,ny-.2)&&!solid(o.x+r,ny-.2))o.y=ny;
}
let near=null;
function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys.has('arrowleft')||keys.has('a'))dx-=1;if(keys.has('arrowright')||keys.has('d'))dx+=1;
  if(keys.has('arrowup')||keys.has('w'))dy-=1;if(keys.has('arrowdown')||keys.has('s'))dy+=1;
  if(!dx&&!dy&&player.tx!=null){const ex=player.tx-player.x,ey=player.ty-player.y,d=Math.hypot(ex,ey);
    if(d<0.12){player.tx=null;if(player.pending){openZone(player.pending);player.pending=null}}else{dx=ex/d;dy=ey/d}}
  const m=Math.hypot(dx,dy);player.moving=m>0;
  if(m){dx/=m;dy/=m;const sp=4.6*dt;const ox=player.x,oy=player.y;tryMove(player,dx*sp,dy*sp);
    if(dx)player.dir=dx>0?1:-1;player.walk+=dt*12;
    if(player.tx!=null){if(Math.hypot(player.x-ox,player.y-oy)<sp*.2){player.stuck+=dt;if(player.stuck>.35){player.tx=null;if(player.pending){openZone(player.pending);player.pending=null}}}else player.stuck=0}}
  near=null;let bd=1.9;for(const z of ZONES){const d=Math.hypot(z.ax-player.x,z.ay-player.y);if(d<bd){bd=d;near=z}}
  const pr=$('#prompt');
  if(near&&current!==near.id){pr.hidden=false;const lbl=`Mở ${near.name}`;if(pr.dataset.l!==lbl){pr.dataset.l=lbl;pr.innerHTML=`<kbd>E</kbd>${lbl}`}}else pr.hidden=true;
}
function updateButler(dt){
  if(!st.butler.hired)return;
  const [tx,ty]=BUTLER_PATH[butler.i];const ex=tx-butler.x,ey=ty-butler.y,d=Math.hypot(ex,ey);
  if(d<.08){butler.i=(butler.i+1)%BUTLER_PATH.length;return}
  const sp=Math.min(d,2.6*dt);butler.x+=ex/d*sp;butler.y+=ey/d*sp;if(Math.abs(ex)>.01)butler.dir=ex>0?1:-1;butler.walk+=dt*10;
}

    else if(t===WA||t===K){g.fillStyle='#3d8db4';g.fillRect(px,py,T,T);if(tile(x,y-1)===SA){g.fillStyle='#6fb6d3';g.fillRect(px,py,T,4)}}
    else if(t===SA){g.fillStyle='#e3cd93';g.fillRect(px,py,T,T);if(hsh(x,y)<.5){g.fillStyle='#d0b87b';g.fillRect(px+8,py+12,3,2)}}
    else if(t===PL){g.fillStyle='#c2bba8';g.fillRect(px,py,T,T);g.fillStyle='#a9a18d';g.fillRect(px,py+T-2,T,2);g.fillRect(px+((y%2)?T/2:0),py,2,T)}
    if(t===K){g.fillStyle='#a8723f';g.fillRect(px+5,py,T-10,T);g.fillStyle='#7c522b';for(let k=0;k<T;k+=8)g.fillRect(px+5,py+k,T-10,2)}
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(map[y*W+x]!==F)continue;const px=x*T,py=y*T;g.fillStyle='#8b5c34';
    if(tile(x-1,y)===F||tile(x+1,y)===F){g.fillRect(px,py+12,T,3);g.fillRect(px,py+21,T,3)}
    if(tile(x,y-1)===F||tile(x,y+1)===F){g.fillRect(px+13,py,3,T)}
    g.fillStyle='#6b4426';g.fillRect(px+12,py+8,6,20)}
  house(g,14,3,19,7,'#2f8f83','#256f66','#efe3c8');
  g.fillStyle='#3a3a3a';g.fillRect(17*T-1,3*T-16,2,20);g.fillStyle='#e8604a';g.fillRect(17*T-3,3*T-20,6,6);
  house(g,25,19,31,23,'#b5523b','#93402e','#f1e2bf');
  g.fillStyle='#2b1d14';g.fillRect(27*T+4,22*T-30,T*2+24,16);g.fillStyle='#f2c14e';g.font='800 11px "Be Vietnam Pro", system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText('HTX',28.5*T,22*T-22);
  house(g,34,18,38,21,'#d9b45a','#b8913b','#e9d9b4');
  // cổng làng
  g.fillStyle='#d9c9a2';g.fillRect(20*T+6,0,T-12,2*T-2);g.fillRect(23*T+6,0,T-12,2*T-2);
  g.fillStyle='#a8977a';g.fillRect(20*T+6,2*T-8,T-12,6);g.fillRect(23*T+6,2*T-8,T-12,6);
  g.fillStyle='#7c3b2a';g.beginPath();g.moveTo(19.4*T,14);g.lineTo(24.6*T,14);g.lineTo(24.2*T,30);g.lineTo(19.8*T,30);g.closePath();g.fill();
  g.fillStyle='#5f2b1e';g.fillRect(19.5*T,26,5*T,4);g.fillRect(19.25*T,8,10,10);g.fillRect(24.75*T-10,8,10,10);
  g.fillStyle='#2b1d14';g.fillRect(20.9*T,34,2.2*T,15);g.fillStyle='#f2c14e';g.font='800 10px "Be Vietnam Pro", system-ui';g.fillText('CỔNG C-CHAIN',22*T,42);
  // market stalls
  [[14,18.2,'#e8604a'],[17.2,18.2,'#3d8db4'],[14,21.6,'#2f8f83'],[17.2,21.6,'#e8604a']].forEach(([x,y,c],i)=>{
    const X=x*T,Y=y*T,w=2.4*T;g.fillStyle='rgba(0,0,0,.18)';g.fillRect(X+4,Y+40,w,8);
    g.fillStyle='#9b6a3c';g.fillRect(X,Y+22,w,20);g.fillStyle='#7c522b';g.fillRect(X,Y+38,w,4);
    for(let k=0;k<6;k++){g.fillStyle=['#f2c14e','#86d36f','#e8604a','#f6efe0'][(k+i)%4];g.beginPath();g.arc(X+8+k*12,Y+26,4,0,7);g.fill()}
    for(let k=0;k<6;k++){g.fillStyle=k%2?'#f6efe0':c;g.fillRect(X+k*w/6,Y,w/6+1,14)}
    g.fillStyle='rgba(0,0,0,.2)';g.fillRect(X,Y+14,w,3);
  });
  for(const z of ZONES)if(z.sx!=null)sign(g,z.sx,z.sy,z.name);
  stat=c;
}

/* ---------- drawing ---------- */
let zoom=1.6,dpr=1;const cam={x:0,y:0};
function resize(){
  dpr=Math.min(2,devicePixelRatio||1);const w=stage.clientWidth,h=stage.clientHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  zoom=Math.max(1.1,Math.min(2.2,Math.min(h/(T*12.5),w/(T*14))));
}
addEventListener('resize',resize);
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function farmer(g,x,y,o){
  const X=x*T,Y=y*T,s=o.moving?Math.sin(o.walk):0,bob=o.moving?Math.abs(Math.sin(o.walk))*1.5:0;
  g.fillStyle='rgba(0,0,0,.25)';ell(g,X,Y,10,4);
  g.fillStyle='#3a2a1e';g.fillRect(X-6,Y-8-(s>0?2:0),5,8);g.fillRect(X+1,Y-8-(s<0?2:0),5,8);
  g.fillStyle=o.shirt;g.fillRect(X-8,Y-21-bob,16,14);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(X-8,Y-10-bob,16,3);
  g.fillStyle='#f0c597';g.fillRect(X-11,Y-19-bob+s,3,8);g.fillRect(X+8,Y-19-bob-s,3,8);
  g.fillStyle='#f0c597';ell(g,X,Y-25-bob,6,6);
  g.fillStyle='#2b1d14';g.fillRect(X+o.dir*2-1,Y-26-bob,2,2);
  g.fillStyle='#e9d39a';g.beginPath();g.moveTo(X-13,Y-26-bob);g.lineTo(X+13,Y-26-bob);g.lineTo(X,Y-39-bob);g.closePath();g.fill();
  g.fillStyle='#c4a25c';g.fillRect(X-13,Y-27-bob,26,2);
  if(o.antenna){g.fillStyle='#3a3a3a';g.fillRect(X-1,Y-46-bob,2,8);g.fillStyle=(performance.now()%900<450)?'#e8604a':'#f2c14e';g.fillRect(X-3,Y-49-bob,6,5)}
}
function lettuce(g,x,y,s){
  const X=x*T,Y=y*T;g.fillStyle='#6b4226';ell(g,X,Y+4,11,5);
  if(s===0){g.fillStyle='#9be07f';g.fillRect(X-3,Y-2,2,5);g.fillRect(X+2,Y-3,2,6);return}
  const r=3+s*1.8;for(let k=0;k<5+s;k++){const a=k/(5+s)*Math.PI*2;g.fillStyle=k%2?'#5fae4c':'#7cc964';ell(g,X+Math.cos(a)*r*.6,Y-1+Math.sin(a)*r*.35,r*.6,r*.5)}
  g.fillStyle='#a6e08c';ell(g,X,Y-2,r*.4,r*.32);
}
function tree(g,x,y,l){
  const X=x*T,Y=y*T;
  if(!l){g.fillStyle='#7a4f2c';ell(g,X,Y,9,4);g.fillStyle='#6b4226';ell(g,X,Y-1,6,2.5);return}
  const pr=Math.max(0,Math.min(1,(st.day-l.start)/l.days)),sz=.4+.6*pr,r=ripe(l);
  const canopy={7:'#4f9e3d',30:'#3d8a36',90:'#2c7439'}[l.days];
  g.fillStyle='rgba(0,0,0,.22)';ell(g,X,Y+2,16*sz+4,5);
  g.fillStyle='#6b4226';g.fillRect(X-3,Y-18*sz,6,18*sz);
  g.fillStyle=canopy;ell(g,X,Y-24*sz,17*sz,14*sz);ell(g,X-9*sz,Y-18*sz,10*sz,9*sz);ell(g,X+9*sz,Y-18*sz,10*sz,9*sz);
  g.fillStyle='rgba(255,255,255,.12)';ell(g,X-4*sz,Y-29*sz,7*sz,4*sz);
  if(r||pr>.75){const fc={7:'#e8604a',30:'#f2c14e',90:'#a9c93f'}[l.days];const n=r?6:2;
    for(let k=0;k<n;k++){const a=k*2.1+l.id;g.fillStyle=fc;ell(g,X+Math.cos(a)*11*sz,Y-21*sz+Math.sin(a)*7*sz,l.days===90?4:3,l.days===90?4:3.4)}
    if(r&&Math.floor(performance.now()/400)%2){g.fillStyle='#fff6cf';g.fillRect(X+12,Y-38,3,3);g.fillRect(X-15,Y-30,2,2)}}
}
function render(now){
  const w=cv.width,h=cv.height,sc=zoom*dpr,vw=w/sc,vh=h/sc;
  let fy=player.y*T;
  if(current&&innerWidth<=760)fy+=vh*0.26;
  cam.x=Math.max(0,Math.min(W*T-vw,player.x*T-vw/2));cam.y=Math.max(0,Math.min(H*T-vh,fy-vh/2));
  if(W*T<vw)cam.x=(W*T-vw)/2;if(H*T<vh)cam.y=(H*T-vh)/2;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#4f8a39';ctx.fillRect(0,0,w,h);
  ctx.setTransform(sc,0,0,sc,-cam.x*sc,-cam.y*sc);ctx.imageSmoothingEnabled=false;
  if(stat)ctx.drawImage(stat,0,0);
  const t=now/1000;
  // water shimmer + fish
  ctx.fillStyle='rgba(255,255,255,.28)';
  for(let i=0;i<22;i++){const x=2.3+((i*3.7)%9.2),y=18.4+((i*2.3)%8.2);ctx.fillRect(x*T+Math.sin(t*1.3+i)*6,y*T,8,2)}
  const lpTot=lpVal()+(st.lp?st.lp.fees:0),nf_=Math.min(16,Math.ceil(lpTot/30));
  for(let i=0;i<nf_;i++){const x=3+((i*2.3)%8)+Math.sin(t*.6+i)*.8,y=19+((i*1.7)%6.5)+Math.cos(t*.5+i*1.3)*.6,dir=Math.cos(t*.6+i)>0?1:-1;
    ctx.fillStyle='rgba(18,62,84,.75)';ell(ctx,x*T,y*T,8,3.5);ctx.beginPath();ctx.moveTo(x*T-dir*7,y*T);ctx.lineTo(x*T-dir*13,y*T-4);ctx.lineTo(x*T-dir*13,y*T+4);ctx.fill()}
  // field beds
  const beds=Math.min(15,Math.ceil(st.lend.p/40));
  BEDS.forEach(([x,y],i)=>{if(i<beds)lettuce(ctx,x,y,Math.floor(((st.day*.9+i*.37)%1)*4));else{ctx.fillStyle='#6b4226';ell(ctx,x*T,y*T+4,11,5)}});
  if(st.lend.acc>.02&&Math.floor(t*2)%2){ctx.fillStyle='#fff3b0';for(let i=0;i<beds;i+=3){const [x,y]=BEDS[i];ctx.fillRect(x*T+8,y*T-10,3,3)}}
  NBEDS.forEach(([x,y],i)=>{lettuce(ctx,x,y,st.neighbor.ripe>i*8?3:1);if(st.neighbor.ripe>10&&i<3&&Math.floor(t*2+i)%2){ctx.fillStyle='#f2c14e';ctx.fillRect(x*T+9,y*T-12,3,3)}});
  // y-sorted sprites
  const spr=[];
  SPOTS.forEach(([x,y],i)=>spr.push({y,f:()=>tree(ctx,x,y,st.locks[i])}));
  spr.push({y:9.6,f:()=>{farmer(ctx,42.5,9.6+Math.sin(t*2)*.02,{shirt:'#7b5ea7',dir:-1,moving:false,walk:0})}});
  if(st.butler.hired){spr.push({y:butler.y,f:()=>farmer(ctx,butler.x,butler.y,{shirt:'#2f8f83',dir:butler.dir,moving:true,walk:butler.walk,antenna:true})})}
  spr.push({y:player.y,f:()=>farmer(ctx,player.x,player.y,{shirt:'#2f5d9e',dir:player.dir,moving:player.moving,walk:player.walk})});
  spr.sort((a,b)=>a.y-b.y).forEach(s=>s.f());
  // near ring
  if(near){ctx.strokeStyle='rgba(242,193,78,'+(.55+.35*Math.sin(t*5))+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(near.ax*T,near.ay*T,20,8,0,0,7);ctx.stroke()}
  // letters
  for(let i=letters.length-1;i>=0;i--){const L=letters[i];L.t+=1/60/1.4;if(L.t>=1){letters.splice(i,1);continue}
    const k=L.t,x=(L.x0+(L.x1-L.x0)*k)*T,y=(L.y0+(L.y1-L.y0)*k)*T-Math.sin(k*Math.PI)*60;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x-6,y+10,12,3);ctx.fillStyle='#fbf6ea';ctx.fillRect(x-7,y-5,14,10);ctx.strokeStyle='#b9ad91';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-7,y-5);ctx.lineTo(x,y+1);ctx.lineTo(x+7,y-5);ctx.stroke();ctx.fillStyle='#e8604a';ctx.fillRect(x-2,y-1,4,4)}
  // floaters
  ctx.font='700 12px "Be Vietnam Pro", system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=1/60/2;if(f.t>=1){floaters.splice(i,1);continue}
    const x=f.x*T,y=f.y*T-f.t*30;ctx.globalAlpha=1-f.t*f.t;ctx.lineWidth=3;ctx.strokeStyle='#1c2a23';ctx.strokeText(f.text,x,y);ctx.fillStyle=f.color;ctx.fillText(f.text,x,y);ctx.globalAlpha=1}
  // weather (screen space)
  ctx.setTransform(1,0,0,1,0,0);
  if(st.weather!=='nắng'){
    const storm=st.weather==='bão';ctx.fillStyle=storm?'rgba(18,24,44,.38)':'rgba(40,62,92,.18)';ctx.fillRect(0,0,w,h);
    if(!reduce){ctx.strokeStyle=storm?'rgba(200,220,255,.55)':'rgba(200,220,255,.4)';ctx.lineWidth=1.2*dpr;ctx.beginPath();
      const n=storm?220:110;for(let i=0;i<n;i++){const sp=storm?900:600;const x=((i*97.3+t*sp*.35)%(w+200))-100,y=((i*61.7+t*sp)%(h+40))-20;ctx.moveTo(x,y);ctx.lineTo(x-(storm?9:4)*dpr,y+14*dpr)}ctx.stroke();
      if(storm&&(Math.sin(t*1.7)>.995||Math.sin(t*2.9+1)>.997)){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(0,0,w,h)}}
  }
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  updatePlayer(dt);if(st.butler.hired)updateButler(dt);
  sim(CH.live?dt/CH.cfg.dayLength:dt*SPEEDS[st.speed]);
  render(now);
  acc+=dt;if(acc>.2){acc=0;renderHud();renderStats()}
  requestAnimationFrame(frame);
}
resize();buildStatic();
(document.fonts?.ready||Promise.resolve()).then(()=>{buildStatic()});
icm('lend','Ký → Fee manager','Gieo hạt: deposit(300,00 USDC) vào FarmGame');
icm('orchard','Ký → Fee manager','Trồng Cây ớt: plant(100,00 USDC, 7 ngày) vào FarmGame');
letters.length=0;
renderLog();renderHud();openZone('home');
window.__farm={st,openZone,ACT,sim};
requestAnimationFrame(frame);
})();
</script>
