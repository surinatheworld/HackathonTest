name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci

      - name: Unit tests (Hardhat)
        run: npx hardhat test

      - name: Gasless end-to-end (fee manager code on a local chain)
        run: |
          npx hardhat node --port 8545 > node.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 && break
            sleep 1
          done
          npx hardhat run scripts/deploy-local.js --network localhost
          SMOKE_LOCAL=1 node scripts/gasless-smoke.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Slither (fails on any high-impact finding)
        run: |
          pip install --quiet slither-analyzer==0.11.6
          slither . --hardhat-ignore-compile --exclude-dependencies \
            --filter-paths "node_modules|contracts/test/" --fail-high
